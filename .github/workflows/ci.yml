name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so a clean build is part of the gate.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No secrets are needed: the tests never call the real Inventory API.
      - name: Test
        run: dotnet test --no-build --configuration Release
